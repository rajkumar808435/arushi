<style>
:root {
  --gold: #c9a66b;
  --background: #09090d;
  --text: #f7f3ed;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  color: var(--text);
  background: var(--background);
}

#app {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(201,166,107,.19), transparent 45%),
    radial-gradient(circle at 10% 90%, rgba(96,70,120,.13), transparent 30%);
}

.card {
  width: min(100%, 440px);
  text-align: center;
  padding: 34px 27px 27px;
  border: 1px solid rgba(201,166,107,.43);
  border-radius: 28px;
  background: linear-gradient(155deg, #211f27, #131219 52%, #0e0d13);
  box-shadow: 0 24px 85px rgba(0,0,0,.58);
}

.brand-mark {
  width: 86px;
  height: 86px;
  margin: 0 auto 18px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--gold);
  box-shadow: 0 0 30px rgba(201,166,107,.17);
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.eyebrow {
  color: #c8b99f;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

h1 {
  color: #f4e8d2;
  font-size: 25px;
  letter-spacing: 1.5px;
  margin: 0 0 24px;
}

.rule {
  width: 58px;
  height: 2px;
  margin: 0 auto 25px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

h2 {
  font-size: 28px;
  line-height: 1.18;
  margin: 0 auto 12px;
  max-width: 330px;
  color: white;
}

h2 span { color: var(--gold); }

.sub {
  color: #bdb6ad;
  font-size: 14px;
  line-height: 1.6;
  margin: 0 auto 27px;
}

.join {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  width: 100%;
  min-height: 58px;
  border-radius: 14px;
  background: linear-gradient(110deg, #b88d50, #f0d39b 55%, #c29a5d);
  color: #17130d;
  text-decoration: none;
  font-weight: 900;
  font-size: 16px;
  letter-spacing: 1px;
  box-shadow: 0 9px 28px rgba(201,166,107,.23);
  transition: transform .2s ease;
}

.join:hover { transform: translateY(-3px); }

.join svg {
  width: 21px;
  height: 21px;
}

.process {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 50px;
  margin-top: 12px;
  border: 1px solid rgba(201,166,107,.55);
  border-radius: 13px;
  color: #ead7b7;
  text-decoration: none;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.3px;
}

.process:hover {
  background: rgba(201,166,107,.10);
}

.note {
  margin: 19px 0 0;
  color: #77727c;
  font-size: 10px;
  letter-spacing: 2px;
}

@media (max-width: 380px) {
  .card { padding: 29px 20px 23px; }
  h1 { font-size: 22px; }
  h2 { font-size: 25px; }
}
</style>
</head>

<body>
<main id="app">
  <section class="card">

    <div class="brand-mark">
      <img src="profile.jpg" alt="Meeting Department">
    </div>

    <p class="eyebrow">Official Telegram Channel</p>

    <h1>MEETING DEPARTMENT</h1>

    <div class="rule"></div>

    <h2>Join Telegram for<br>
      <span>Playboy Jobs</span>
    </h2>

    <p class="sub">
      Join our Telegram channel to view job updates and role details.
    </p>

    <!-- Main Telegram Button -->
    <a class="join"
       href="https://t.me/+hPNjQPTpHpo3Mjhl"
       id="telegram-join"
       target="_blank"
       rel="noopener noreferrer">

      <svg viewBox="0 0 24 24" fill="none">
        <path d="m21 3-7.2 18-3.8-7-7-3.8L21 3Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"/>
        <path d="m10 14 5-5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>

      SUBSCRIBE ON TELEGRAM
    </a>

    <!-- Second Button: Direct Telegram Link -->
    <a class="process"
       href="https://t.me/+hPNjQPTpHpo3Mjhl"
       id="process-button"
       target="_blank"
       rel="noopener noreferrer">
      VIEW JOINING PROCESS
    </a>

    <p class="note">MEETING DEPARTMENT · OFFICIAL</p>

  </section>
</main>

<script>
document.getElementById('process-button').addEventListener('click', function () {

  }

</script>

</html>
